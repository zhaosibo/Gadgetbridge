name: Build Bangle.js Gadgetbridge - Wena Chinese

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract source package
        run: |
          rm -rf extracted
          mkdir -p extracted

          tar -xzf Gadgetbridge-0.93.0-banglejs-Wena-S2T-source.tar.gz \
            -C extracted

          SOURCE_DIR="extracted/com.espruino.gadgetbridge.banglejs_252_src.tar.gz"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "ERROR: source directory not found:"
            echo "$SOURCE_DIR"
            echo "Contents of extracted:"
            find extracted -maxdepth 3 -print
            exit 1
          fi

          echo "SOURCE_DIR=$SOURCE_DIR"
          echo "source_dir=$SOURCE_DIR" >> "$GITHUB_OUTPUT"

      - name: Generate Gradle wrapper
        working-directory: extracted/com.espruino.gadgetbridge.banglejs_252_src.tar.gz
        run: |
          echo "=== Gradle version ==="
          gradle --version

          echo "=== Generate Gradle wrapper 8.13 ==="
          gradle wrapper --gradle-version 8.13

          echo "=== Verify wrapper ==="
          ls -la
          ls -la gradle/wrapper
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

      - name: Configure Android SDK
        working-directory: extracted/com.espruino.gadgetbridge.banglejs_252_src.tar.gz
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Build Bangle.js debug APK
        working-directory: extracted/com.espruino.gadgetbridge.banglejs_252_src.tar.gz
        run: |
          ./gradlew --version
          ./gradlew :app:assembleBanglejsDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gadgetbridge-0.93.0-banglejs-Wena-S2T
          path: extracted/com.espruino.gadgetbridge.banglejs_252_src.tar.gz/app/build/outputs/apk/banglejs/debug/*.apk
          if-no-files-found: error
          retention-days: 30
