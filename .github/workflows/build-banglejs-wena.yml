name: Build Bangle.js Gadgetbridge - Wena Chinese

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Extract source package
        run: |
          rm -rf extracted
          mkdir -p extracted

          tar -xzf Gadgetbridge-0.93.0-banglejs-Wena-S2T-source.tar.gz \
            -C extracted

          SOURCE_DIR="extracted/com.espruino.gadgetbridge.banglejs_252_src.tar.gz"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "ERROR: source directory not found:"
            echo "$SOURCE_DIR"
            echo "Contents of extracted:"
            find extracted -maxdepth 3 -type f
            exit 1
          fi

          echo "=== Source directory ==="
          find "$SOURCE_DIR" -maxdepth 2 -type f | head -100

      - name: Find Gradle project
        id: find_project
        run: |
          PROJECT_DIR=$(find extracted/com.espruino.gadgetbridge.banglejs_252_src.tar.gz -name gradlew -type f -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found"
            find extracted/com.espruino.gadgetbridge.banglejs_252_src.tar.gz -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Bangle.js debug APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          ./gradlew :app:assembleBanglejsDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gadgetbridge-0.93.0-banglejs-Wena-S2T
          path: ${{ steps.find_project.outputs.project_dir }}/app/build/outputs/apk/banglejs/debug/*.apk
          if-no-files-found: error
          retention-days: 30
