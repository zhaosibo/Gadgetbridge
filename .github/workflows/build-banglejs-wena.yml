name: Build Bangle.js Gadgetbridge - Wena Chinese

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0"

      - name: Extract Gadgetbridge source
        run: |
          rm -rf extracted
          mkdir -p extracted

          echo "=== Extract outer archive ==="
          tar -xzf Gadgetbridge-0.93.0-banglejs-Wena-S2T-source.tar.gz \
            -C extracted

          echo "=== Find inner source archive ==="
          INNER_ARCHIVE=$(find extracted -type f \
            -name 'com.espruino.gadgetbridge.banglejs_252_src.tar.gz' \
            -print -quit)

          if [ -z "$INNER_ARCHIVE" ]; then
            echo "ERROR: inner source archive not found"
            echo "=== Extracted files ==="
            find extracted -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Inner archive: $INNER_ARCHIVE"

          echo "=== Extract inner source archive ==="
          mkdir -p gadgetbridge

          tar -xzf "$INNER_ARCHIVE" -C gadgetbridge

          echo "=== Locate Gradle wrapper ==="
          GRADLE_WRAPPER=$(find gadgetbridge -type f \
            -name 'gradlew' \
            -print -quit)

          if [ -z "$GRADLE_WRAPPER" ]; then
            echo "ERROR: gradlew not found after extracting source"
            echo "=== Extracted source ==="
            find gadgetbridge -maxdepth 4 -type f -print
            exit 1
          fi

          SOURCE_DIR=$(dirname "$GRADLE_WRAPPER")

          echo "Source directory: $SOURCE_DIR"

          echo "sdk.dir=${ANDROID_SDK_ROOT}" > "$SOURCE_DIR/local.properties"
          chmod +x "$GRADLE_WRAPPER"

          echo "GADGETBRIDGE_SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Show Gradle and Android environment
        working-directory: ${{ env.GADGETBRIDGE_SOURCE_DIR }}
        run: |
          echo "Java:"
          java -version

          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo "Gradle:"
          ./gradlew --version

      - name: Build Bangle.js debug APK
        working-directory: ${{ env.GADGETBRIDGE_SOURCE_DIR }}
        run: |
          ./gradlew :app:assembleBanglejsDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gadgetbridge-0.93.0-banglejs-Wena-S2T
          path: ${{ env.GADGETBRIDGE_SOURCE_DIR }}/app/build/outputs/apk/banglejs/debug/*.apk
          if-no-files-found: error
          retention-days: 30
