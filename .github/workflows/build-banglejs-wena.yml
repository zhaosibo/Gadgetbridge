name: Build Bangle.js Gadgetbridge - Wena Chinese

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract source package
        run: |
          rm -rf extracted
          mkdir -p extracted

          tar -xzf Gadgetbridge-0.93.0-banglejs-Wena-S2T-source.tar.gz \
            -C extracted

          SOURCE_DIR="extracted/com.espruino.gadgetbridge.banglejs_252_src.tar.gz"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "ERROR: source directory not found:"
            echo "$SOURCE_DIR"
            echo "Contents of extracted:"
            find extracted -maxdepth 3 -print
            exit 1
          fi

          echo "SOURCE_DIR=$SOURCE_DIR"

      - name: Generate Gradle wrapper
        working-directory: extracted/com.espruino.gadgetbridge.banglejs_252_src.tar.gz
        run: |
          echo "=== Gradle version ==="
          gradle --version

          echo "=== Generate Gradle wrapper ==="
          gradle wrapper --gradle-version 8.13

          chmod +x gradlew

          echo "=== Set official Gradle 8.13 distribution checksum ==="
          GRADLE_SHA256=$(curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip.sha256 | awk '{print $1}')

          if [ -z "$GRADLE_SHA256" ]; then
            echo "ERROR: Could not obtain Gradle 8.13 SHA-256 checksum"
            exit 1
          fi

          echo "Official Gradle 8.13 SHA-256:"
          echo "$GRADLE_SHA256"

          sed -i '/^distributionSha256Sum=/d' gradle/wrapper/gradle-wrapper.properties

          printf '\ndistributionSha256Sum=%s\n' "$GRADLE_SHA256" >> gradle/wrapper/gradle-wrapper.properties

          echo "=== Final gradle-wrapper.properties ==="
          cat gradle/wrapper/gradle-wrapper.properties

          echo "=== Verify wrapper files ==="
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Initialize Git repository for source
        working-directory: extracted/com.espruino.gadgetbridge.banglejs_252_src.tar.gz
        run: |
          echo "=== Initialize Git repository ==="

          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add .

          git commit -m "Build source package"

          echo "=== Git repository ==="
          git status
          git log -1 --oneline

          echo "=== Verify .git/HEAD ==="
          test -f .git/HEAD
          cat .git/HEAD

      - name: Configure Android SDK
        working-directory: extracted/com.espruino.gadgetbridge.banglejs_252_src.tar.gz
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Build Bangle.js debug APK
        working-directory: extracted/com.espruino.gadgetbridge.banglejs_252_src.tar.gz
        run: |
          echo "=== Gradle Wrapper version ==="
          ./gradlew --version

          echo "=== Build APK ==="
          ./gradlew :app:assembleBanglejsDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gadgetbridge-0.93.0-banglejs-Wena-S2T
          path: extracted/com.espruino.gadgetbridge.banglejs_252_src.tar.gz/app/build/outputs/apk/banglejs/debug/*.apk
          if-no-files-found: error
          retention-days: 30
